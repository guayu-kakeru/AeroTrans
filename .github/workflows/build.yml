name: build-preview

on:
  pull_request:
    branches: [main]

jobs:
  bundle:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Build tauri app (no signing)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles app
